services:
  server:
    build: .
    container_name: server_part_6
    networks:
      - local

  proxy:
    image: nginx:1.28.1
    container_name: proxy_part_6
    ports:
      - "80:8080"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
      - local

networks:
  local:  
